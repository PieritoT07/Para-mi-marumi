<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💐 Para ti, Hilary 💐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #fff9f0 0%, #fce8e0 30%, #f5ddd0 60%, #fce8e0 100%);
            font-family: 'Georgia', 'Segoe UI', serif;
            overflow: hidden;
            position: relative;
        }

        /* FONDO MUCHO MÁS CLARO Y CON BURBUJAS SUAVES */
        .bubble {
            position: fixed;
            border-radius: 50%;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            animation: floatBubble 25s ease-in-out infinite alternate;
        }
        .bubble-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ffd4e0, #ffb0c8);
            top: -150px;
            left: -150px;
        }
        .bubble-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #d4e8ff, #a0c8f0);
            bottom: -200px;
            right: -150px;
            animation-delay: 4s;
        }
        .bubble-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #ffe0c0, #ffc8a0);
            top: 40%;
            left: 30%;
            animation-delay: 8s;
        }
        .bubble-4 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #e0f0e8, #b0d8c8);
            top: 10%;
            right: 5%;
            animation-delay: 2s;
        }
        .bubble-5 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #f5d0e8, #e8b0d0);
            bottom: 15%;
            left: 5%;
            animation-delay: 6s;
        }
        .bubble-6 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #fff0c0, #f5d88a);
            top: 5%;
            left: 45%;
            animation-delay: 3s;
        }

        @keyframes floatBubble {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -40px) scale(1.15);
            }
        }

        /* ESCENA 3D - MÁS GRANDE PARA MÁS LIRIOS */
        .scene {
            width: 900px;
            height: 750px;
            perspective: 1600px;
            perspective-origin: 50% 35%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .lily-group {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: floatGroup 10s ease-in-out infinite alternate;
        }

        .lily {
            position: absolute;
            width: 120px;
            height: 190px;
            transform-style: preserve-3d;
            transform-origin: bottom center;
        }

        /* 14 LIRIOS BIEN DISTRIBUIDOS */
        .lily-1 {
            left: 50%;
            top: 32%;
            transform: translateX(-50%) rotateX(-3deg) rotateZ(-1deg) translateY(-8px);
            z-index: 15;
        }
        .lily-2 {
            left: 18%;
            top: 45%;
            transform: translateX(-50%) rotateX(6deg) rotateZ(20deg) translateY(-2px);
            z-index: 8;
        }
        .lily-3 {
            left: 82%;
            top: 45%;
            transform: translateX(-50%) rotateX(6deg) rotateZ(-20deg) translateY(-2px);
            z-index: 8;
        }
        .lily-4 {
            left: 8%;
            top: 20%;
            transform: translateX(-50%) rotateX(-10deg) rotateZ(30deg) translateY(-22px) scale(0.8);
            z-index: 4;
        }
        .lily-5 {
            left: 92%;
            top: 20%;
            transform: translateX(-50%) rotateX(-10deg) rotateZ(-30deg) translateY(-22px) scale(0.8);
            z-index: 4;
        }
        .lily-6 {
            left: 30%;
            top: 10%;
            transform: translateX(-50%) rotateX(-6deg) rotateZ(10deg) translateY(-32px) scale(0.7);
            z-index: 3;
        }
        .lily-7 {
            left: 70%;

            z-index: 3;
        }
        .lily-8 {
            left: 50%;
            top: 60%;
            transform: translateX(-50%) rotateX(10deg) rotateZ(0deg) translateY(8px) scale(0.85);
            z-index: 6;
        }
        .lily-9 {
            left: 10%;
            top: 65%;
            transform: translateX(-50%) rotateX(12deg) rotateZ(15deg) translateY(10px) scale(0.75);
            z-index: 5;
        }
        .lily-10 {
            left: 90%;
            top: 65%;
            transform: translateX(-50%) rotateX(12deg) rotateZ(-15deg) translateY(10px) scale(0.75);
            z-index: 5;
        }
        .lily-11 {
            left: 38%;
            top: 72%;
            transform: translateX(-50%) rotateX(8deg) rotateZ(8deg) translateY(15px) scale(0.7);
            z-index: 4;
        }
        .lily-12 {
            left: 62%;
            top: 72%;
            transform: translateX(-50%) rotateX(8deg) rotateZ(-8deg) translateY(15px) scale(0.7);
            z-index: 4;
        }
        .lily-13 {
            left: 22%;
            top: 28%;
            transform: translateX(-50%) rotateX(-8deg) rotateZ(25deg) translateY(-18px) scale(0.75);
            z-index: 5;
        }
        .lily-14 {
            left: 78%;
            top: 28%;
            transform: translateX(-50%) rotateX(-8deg) rotateZ(-25deg) translateY(-18px) scale(0.75);
            z-index: 5;
        }

        /* ===== TALLO ===== */
        .stem {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 5px;
            height: 85px;
            background: linear-gradient(to top, #3a9a5a, #6ccd8a);
            transform: translateX(-50%);
            border-radius: 4px 4px 8px 8px;
            box-shadow: 0 0 20px rgba(80, 220, 130, 0.2);
            transform-origin: bottom center;
        }
        .stem::before,
        .stem::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 28px;
            background: radial-gradient(ellipse at 30% 50%, #6ccd8a, #3a8a4a);
            border-radius: 50% 0 50% 50%;
            top: 28px;
            box-shadow: 0 0 12px rgba(60, 200, 100, 0.15);
        }
        .stem::before {
            left: -12px;
            transform: rotate(30deg) skewX(5deg);
        }
        .stem::after {
            right: -12px;
            transform: rotate(-30deg) scaleX(-1) skewX(5deg);
        }

        /* ===== FLOR ===== */
        .flower {
            position: absolute;
            bottom: 68px;
            left: 50%;
            transform: translateX(-50%);
            width: 75px;
            height: 75px;
            transform-style: preserve-3d;
        }

        .calyx {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 18px;
            background: radial-gradient(ellipse at 50% 100%, #4a9a5a, #2a6a3a);
            border-radius: 50% 50% 30% 30% / 60% 60% 20% 20%;
            box-shadow: 0 -4px 15px rgba(50, 200, 80, 0.3);
        }

        .petal {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 30px;
            height: 46px;
            transform-origin: bottom center;
            border-radius: 50% 50% 20% 20% / 80% 80% 10% 10%;
            transform-style: preserve-3d;
            backface-visibility: visible;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* COLORES VIVOS Y BRILLANTES PARA CADA LIRIO */
        .lily-1 .petal {
            background: radial-gradient(ellipse at 30% 20%, #fff5f0, #ff9eb0, #ff7088);
            box-shadow: 0 4px 25px rgba(255, 100, 140, 0.35);
        }
        .lily-2 .petal {
            background: radial-gradient(ellipse at 30% 20%, #fff8f0, #ffc890, #ffa850);
            box-shadow: 0 4px 25px rgba(255, 170, 60, 0.35);
        }
        .lily-3 .petal {
            background: radial-gradient(ellipse at 30% 20%, #fff5f5, #f0b8d8, #e088c0);
            box-shadow: 0 4px 25px rgba(210, 100, 180, 0.35);
        }
        .lily-4 .petal {
            background: radial-gradient(ellipse at 30% 20%, #f8faff, #a8c8f8, #78a8f0);
            box-shadow: 0 4px 25px rgba(80, 150, 255, 0.3);
        }
        .lily-5 .petal {
            background: radial-gradient(ellipse at 30% 20%, #f8fffa, #88d8c8, #58c0a8);
            box-shadow: 0 4px 25px rgba(60, 210, 180, 0.3);
        }
        .lily-6 .petal {
            background: radial-gradient(ellipse at 30% 20%, #fffcf0, #f5d860, #e8b830);
            box-shadow: 0 4px 25px rgba(240, 200, 40, 0.35);
        }
        .lily-7 .petal {
            background: radial-gradient(ellipse at 30% 20%, #fff8f5, #e8a8c8, #d080b0);
            box-shadow: 0 4px 25px rgba(200, 80, 160, 0.3);
        }
        .lily-8 .petal {
            background: radial-gradient(ellipse at 30% 20%, #fff8f0, #ffb888, #ff8858);
            box-shadow: 0 4px 25px rgba(255, 130, 70, 0.35);
        }
        .lily-9 .petal {
            background: radial-gradient(ellipse at 30% 20%, #f8faff, #88b8f0, #5888d8);
            box-shadow: 0 4px 25px rgba(60, 120, 230, 0.3);
        }
        .lily-10 .petal {
            background: radial-gradient(ellipse at 30% 20%, #f8fffa, #78d0b0, #48b890);
            box-shadow: 0 4px 25px rgba(50, 200, 160, 0.3);
        }
        .lily-11 .petal {
            background: radial-gradient(ellipse at 30% 20%, #fffcf5, #f5c8a0, #e8a070);
            box-shadow: 0 4px 25px rgba(230, 150, 80, 0.3);
        }
        .lily-12 .petal {
            background: radial-gradient(ellipse at 30% 20%, #fff5f8, #f0a0c8, #d880b0);
            box-shadow: 0 4px 25px rgba(210, 90, 170, 0.3);
        }
        .lily-13 .petal {
            background: radial-gradient(ellipse at 30% 20%, #f8fff8, #88d8a8, #50b888);
            box-shadow: 0 4px 25px rgba(60, 200, 130, 0.3);
        }
        .lily-14 .petal {
            background: radial-gradient(ellipse at 30% 20%, #fff8f5, #f5b890, #e89068);
            box-shadow: 0 4px 25px rgba(230, 130, 80, 0.3);
        }

        .petal::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 55%;
            height: 30%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.5), transparent);
            border-radius: 50%;
            filter: blur(2px);
        }

        .petal-1 {
            transform: translateX(-50%) rotateX(20deg) rotateZ(0deg) translateY(-6px);
        }
        .petal-2 {
            transform: translateX(-50%) rotateX(20deg) rotateZ(60deg) translateY(-6px);
        }
        .petal-3 {
            transform: translateX(-50%) rotateX(20deg) rotateZ(120deg) translateY(-6px);
        }
        .petal-4 {
            transform: translateX(-50%) rotateX(20deg) rotateZ(180deg) translateY(-6px);
        }
        .petal-5 {
            transform: translateX(-50%) rotateX(20deg) rotateZ(240deg) translateY(-6px);
        }
        .petal-6 {
            transform: translateX(-50%) rotateX(20deg) rotateZ(300deg) translateY(-6px);
        }

        .petal-inner {
            height: 32px;
            width: 20px;
            border-radius: 50% 50% 30% 30% / 70% 70% 20% 20%;
            transform-origin: bottom center;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .petal-inner::after {
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.4), transparent);
            top: 4px;
            height: 25%;
        }

        /* PÉTALOS INTERNOS MÁS CLAROS */
        .lily-1 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #ffd0d8);
        }
        .lily-2 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #ffdec0);
        }
        .lily-3 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #f8d0e8);
        }
        .lily-4 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #d0dff8);
        }
        .lily-5 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #c8e8e0);
        }
        .lily-6 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #f8e8a0);
        }
        .lily-7 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #f0c8e0);
        }
        .lily-8 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #ffd8b8);
        }
        .lily-9 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #b0c8f0);
        }
        .lily-10 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #98d8c0);
        }
        .lily-11 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #f5d0b0);
        }
        .lily-12 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #f0b8d0);
        }
        .lily-13 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #a8d8b8);
        }
        .lily-14 .petal-inner {
            background: radial-gradient(ellipse at 30% 20%, #fffaf8, #f5c8a8);
        }

        .petal-inner-1 {
            transform: translateX(-50%) rotateX(36deg) rotateZ(30deg) translateY(-3px);
        }
        .petal-inner-2 {
            transform: translateX(-50%) rotateX(36deg) rotateZ(90deg) translateY(-3px);
        }
        .petal-inner-3 {
            transform: translateX(-50%) rotateX(36deg) rotateZ(150deg) translateY(-3px);
        }
        .petal-inner-4 {
            transform: translateX(-50%) rotateX(36deg) rotateZ(210deg) translateY(-3px);
        }
        .petal-inner-5 {
            transform: translateX(-50%) rotateX(36deg) rotateZ(270deg) translateY(-3px);
        }
        .petal-inner-6 {
            transform: translateX(-50%) rotateX(36deg) rotateZ(330deg) translateY(-3px);
        }

        /* ESTAMBRES */
        .stamens {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            transform-style: preserve-3d;
        }
        .stamen {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 3px;
            height: 18px;
            background: linear-gradient(to top, #e8d4b0, #f5e8c8);
            transform-origin: bottom center;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(220, 180, 70, 0.4);
        }
        .stamen::after {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #f7e090, #d4a84a);
            border-radius: 50%;
            box-shadow: 0 0 15px #f7e090, 0 0 30px rgba(240, 200, 80, 0.2);
        }
        .stamen-1 {
            transform: translateX(-50%) rotateX(26deg) rotateZ(0deg) translateY(-2px);
        }
        .stamen-2 {
            transform: translateX(-50%) rotateX(26deg) rotateZ(72deg) translateY(-2px);
        }
        .stamen-3 {
            transform: translateX(-50%) rotateX(26deg) rotateZ(144deg) translateY(-2px);
        }
        .stamen-4 {
            transform: translateX(-50%) rotateX(26deg) rotateZ(216deg) translateY(-2px);
        }
        .stamen-5 {
            transform: translateX(-50%) rotateX(26deg) rotateZ(288deg) translateY(-2px);
        }

        /* ANIMACIONES */
        @keyframes floatGroup {
            0% {
                transform: rotateY(-5deg) rotateX(2deg) translateY(0px);
            }
            100% {
                transform: rotateY(5deg) rotateX(-2deg) translateY(-25px);
            }
        }

        .lily {
            animation: sway 5.5s ease-in-out infinite alternate;
        }
        .lily-1 {
            animation-delay: 0s;
        }
        .lily-2 {
            animation-delay: 0.4s;
        }
        .lily-3 {
            animation-delay: 0.8s;
        }
        .lily-4 {
            animation-delay: 0.2s;
        }
        .lily-5 {
            animation-delay: 0.6s;
        }
        .lily-6 {
            animation-delay: 1s;
        }
        .lily-7 {
            animation-delay: 0.3s;
        }
        .lily-8 {
            animation-delay: 0.7s;
        }
        .lily-9 {
            animation-delay: 1.1s;
        }
        .lily-10 {
            animation-delay: 0.5s;
        }
        .lily-11 {
            animation-delay: 0.9s;
        }
        .lily-12 {
            animation-delay: 0.1s;
        }
        .lily-13 {
            animation-delay: 0.6s;
        }
        .lily-14 {
            animation-delay: 1s;
        }

        @keyframes sway {
            0% {
                transform: translateX(-50%) rotateZ(-4deg) rotateX(3deg);
            }
            100% {
                transform: translateX(-50%) rotateZ(4deg) rotateX(-3deg);
            }
        }

        /* MENSAJE PARA HILARY - MÁS BRILLANTE */
        .message {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            animation: messagePulse 3s ease-in-out infinite;
        }

        .message h1 {
            font-size: 3.8rem;
            font-weight: 700;
            color: #7a4068;
            text-shadow:
                0 0 30px rgba(255, 180, 210, 0.6),
                0 0 80px rgba(255, 180, 210, 0.3),
                0 4px 30px rgba(150, 80, 130, 0.1);
            letter-spacing: 5px;
            font-family: 'Georgia', 'Segoe UI', serif;
        }

        .message h1 .heart {
            color: #e85070;
            display: inline-block;
            animation: heartBeat 1.2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(232, 80, 112, 0.5);
        }

        .message p {
            font-size: 1.6rem;
            color: #9a6a8a;
            margin-top: 6px;
            letter-spacing: 8px;
            font-weight: 300;
            text-shadow: 0 0 40px rgba(255, 200, 220, 0.4);
            font-style: italic;
        }

        @keyframes messagePulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        @keyframes heartBeat {
            0%,
            100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.35);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.25);
            }
            60% {
                transform: scale(1);
            }
        }

        /* PÉTALOS CAYENDO - MÁS Y MÁS BONITOS */
        .falling-petals {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .falling-petal {
            position: absolute;
            border-radius: 50% 50% 20% 20% / 80% 80% 10% 10%;
            opacity: 0.5;
            animation: fall linear infinite;
        }

        .falling-petal:nth-child(1) {
            left: 3%;
            background: #ff9eb0;
            animation-duration: 13s;
            animation-delay: 0s;
            width: 14px;
            height: 18px;
        }
        .falling-petal:nth-child(2) {

            background: #ffc890;
            animation-duration: 15s;
            animation-delay: 2s;
            width: 11px;
            height: 15px;
        }
        .falling-petal:nth-child(3) {

            background: #f0b8d8;

        .falling-petal:nth-child(9) {

        }
        .falling-petal:nth-child(10) {
            left: 74%;
            background: #78d0b0;
            animation-duration: 12s;
            animation-delay: 3s;
            width: 11px;

        }
        .falling-petal:nth-child(11) {
            left: 82%;

        }
        .falling-petal:nth-child(13) {
            left: 97%;
            background: #88d8a8;
            animation-duration: 15s;
            animation-delay: 4s;
            width: 11px;
            height: 15px;
        }

        @keyframes fall {
            0% {
